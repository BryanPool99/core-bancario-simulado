server:
  port: 8082
spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT_TRANSFERS}/${POSTGRES_DB_TRANSFERS}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        #format_sql: true

services:
  account-service:
    url: http://localhost:8081