server:
  port: 8081
spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT_ACCOUNTS}/${POSTGRES_DB_ACCOUNTS}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect